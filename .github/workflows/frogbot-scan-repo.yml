name: "Frogbot Scan Repository"

on:
  workflow_dispatch:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  security-events: write
  # Mandatory when using OIDC authentication protocol instead of JF_ACCESS_TOKEN
  id-token: write

env:
  JF_URL: ${{ vars.JF_URL }}
  # Changed to the built-in GITHUB_TOKEN (or replace with secrets.GIT_TOKEN if using a custom PAT)
  JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository (${{ matrix.branch }} branch)
    strategy:
      matrix:
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0 # FIX: Disables shallow clones to prevent Git fetch errors

      - uses: jfrog/frogbot@v3
        with:
          oidc-provider-name: amitesh-jfrog/flask-webgoat@github
