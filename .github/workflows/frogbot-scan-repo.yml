name: "Frogbot Scan Repository"

on:
  workflow_dispatch:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * *"
  push:
    branches:
      - main # Change to 'master' if your repo uses master

permissions:
  pull-requests: write
  contents: write
  security-events: write
  id-token: write

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run Frogbot Scan
        uses: jfrog/frogbot@v3
        with:
          oidc-provider-name: amitesh-jfrog/flask-webgoat@github
